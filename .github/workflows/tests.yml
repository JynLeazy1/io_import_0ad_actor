---
name: tests
on:
  - push
  - pull_request
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run tests
        run: python -m pytest -v tests
